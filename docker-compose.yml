services:
  postgres:
    image: postgres:16-alpine
    container_name: mercury-commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mercury_commerce
      POSTGRES_USER: mercury
      POSTGRES_PASSWORD: mercury_local_dev
    ports:
      - "5434:5432"
    volumes:
      - mercury-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury_commerce"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mercury-postgres-data:
